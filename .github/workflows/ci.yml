name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit
      - name: Unit tests
        run: |
          node --experimental-strip-types src/lib/lang.test.mjs
          node --experimental-strip-types src/lib/diagram-pages.test.mjs
      # Full production build; needs no secrets (auth, DB and AI are runtime-only).
      - run: npm run build
